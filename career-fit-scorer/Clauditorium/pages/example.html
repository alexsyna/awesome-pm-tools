<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Example</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: grid; place-items: center; padding: 24px; box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: #f8f8fb; color: #1f1f2e; text-align: center;
    }
    h1 { font-size: clamp(32px, 6vw, 56px); margin: 0 0 12px; }
    p { font-size: 18px; line-height: 1.5; color: #5b5b6b; margin: 0 0 8px; }
    code { background: #eeedfd; color: #4f46e5; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>It works.</h1>
    <p>This is <code>pages/example.html</code>, shown through Clauditorium.</p>
    <p>Add your own file to <code>pages/</code> and open <code>?page=&lt;name&gt;</code>.</p>
  </main>
</body>
</html>
